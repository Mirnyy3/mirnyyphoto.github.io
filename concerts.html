
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Концерты — Игорь Мирный</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#11100f;color:#eee8df;font-family:Georgia,serif}
a{color:inherit;text-decoration:none}
header{padding:25px 7%;border-bottom:1px solid #39332e;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px}
.back{font:13px Arial;color:#b9aaa0}
main{padding:65px 7% 90px}
.eyebrow{color:#a98d73;text-transform:uppercase;letter-spacing:4px;font:11px Arial}
h1{font-size:clamp(42px,7vw,72px);font-weight:normal;margin:18px 0}
.description{color:#b9aaa0;font:15px Arial;line-height:1.7;margin-bottom:40px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gallery img{width:100%;height:340px;object-fit:cover;display:block;cursor:pointer;transition:.3s}
.gallery img:hover{filter:brightness(.8)}
.status{color:#b9aaa0;font:14px Arial}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:10;align-items:center;justify-content:center;padding:35px}
.lightbox.open{display:flex}
.lightbox img{max-width:95%;max-height:88vh;object-fit:contain}
.close{position:absolute;right:25px;top:18px;font:32px Arial;color:white;cursor:pointer}
@media(max-width:850px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery img{height:280px}}
@media(max-width:520px){.gallery{grid-template-columns:1fr 1fr;gap:7px}.gallery img{height:210px}header{gap:15px}}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">Игорь Мирный</a>
<a class="back" href="index.html">← На главную</a>
</header>
<main>
<div class="eyebrow">Portfolio · Live music</div>
<h1>Концерты</h1>
<p class="description">Музыка, свет, энергия сцены и живые эмоции.</p>
<div class="gallery" id="gallery">
<p class="status">Загружаем фотографии...</p>
</div>
</main>
<div class="lightbox" id="lightbox">
<span class="close" id="close">×</span>
<img id="largeImage" alt="Фотография">
</div>
<script>
const gallery=document.getElementById('gallery');
const lightbox=document.getElementById('lightbox');
const largeImage=document.getElementById('largeImage');
const extensions=['jpg','jpeg','png','webp','gif'];
fetch('https://api.github.com/repos/Mirnyy3/mirnyyphoto.github.io/contents/images/reportage')
.then(response=>{
 if(!response.ok)throw new Error('Не удалось загрузить фотографии');
 return response.json();
})
.then(files=>{
 const photos=files.filter(file=>file.type==='file'&&extensions.includes(file.name.split('.').pop().toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
 gallery.innerHTML='';
 if(!photos.length){gallery.innerHTML='<p class="status">В этой галерее пока нет фотографий.</p>';return;}
 photos.forEach(photo=>{
  const img=document.createElement('img');
  img.src=photo.download_url;
  img.alt='Концертная фотография';
  img.loading='lazy';
  img.addEventListener('click',()=>{
   largeImage.src=photo.download_url;
   lightbox.classList.add('open');
  });
  gallery.appendChild(img);
 });
})
.catch(()=>{
 gallery.innerHTML='<p class="status">Не удалось загрузить фотографии. Обновите страницу немного позже.</p>';
});
document.getElementById('close').addEventListener('click',()=>lightbox.classList.remove('open'));
lightbox.addEventListener('click',e=>{if(e.target===lightbox)lightbox.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')lightbox.classList.remove('open')});
</script>
</body>
</html>
